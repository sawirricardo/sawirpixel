# The app, Horizon and the scheduler run the same image with different commands, sharing one storage
# volume, Postgres and Redis. Settings come from .env; the overrides below point the containers at each
# other instead of at services on the host.
x-app: &app
  image: sawirstudio/sawirpixel:latest
  platform: linux/amd64
  env_file: .env
  environment: &app-environment
    APP_ENV: production
    APP_DEBUG: "false"
    DB_CONNECTION: pgsql
    DB_HOST: db
    DB_PORT: "5432"
    DB_DATABASE: sawirpixel
    DB_USERNAME: sawirpixel
    DB_PASSWORD: sawirpixel
    REDIS_HOST: redis
    QUEUE_CONNECTION: redis
  volumes:
    - storage:/var/www/html/storage/app
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  app:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_ID: 82
        GROUP_ID: 82
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/up"]
      interval: 15s
      timeout: 5s
      retries: 5

  horizon:
    <<: *app
    command: ["php", "/var/www/html/artisan", "horizon"]
    stop_signal: SIGTERM
    stop_grace_period: 60s
    environment:
      <<: *app-environment
      AUTORUN_ENABLED: "false"
    # Start once the app has run the migrations.
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "healthcheck-horizon"]
      start_period: 10s

  task:
    <<: *app
    command: ["php", "/var/www/html/artisan", "schedule:work"]
    stop_signal: SIGTERM
    environment:
      <<: *app-environment
      AUTORUN_ENABLED: "false"
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "healthcheck-schedule"]
      start_period: 10s

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: sawirpixel
      POSTGRES_USER: sawirpixel
      POSTGRES_PASSWORD: sawirpixel
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sawirpixel -d sawirpixel"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data

volumes:
  storage:
  db:
  redis:
